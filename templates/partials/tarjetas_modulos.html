{# Tarjetas de acceso a módulos. Espera "modulos": lista de (ícono, título, descripción). #}
<div class="row g-4">
  {% for icono, titulo, descripcion in modulos %}
    <div class="col-sm-6 col-lg-4">
      <div class="card tarjeta h-100 border-0 shadow-sm p-4 opacity-75">
        <div class="d-flex align-items-start gap-3">
          <div class="icono-circulo flex-shrink-0"><i class="bi {{ icono }}"></i></div>
          <div>
            <h2 class="h6 fw-bold mb-1">{{ titulo }}</h2>
            <p class="small text-secondary mb-2">{{ descripcion }}</p>
            <span class="badge text-bg-light border">Próximamente</span>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
